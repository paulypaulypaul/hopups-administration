<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Coats N Stuff (Demo)</title>
    <style>
      body {
        font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        margin: 0;
        color: #212121;
      }
      nav {
        background: #212121;
        color: #fff;
        padding: 1rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      nav .brand {
        font-weight: 700;
      }
      nav .phone-number {
        font-weight: 700;
        color: #ff4081;
      }
      .jumbotron {
        padding: 3rem 1.5rem;
        background: #fafafa;
        text-align: center;
      }
      .jackets {
        display: flex;
        gap: 1rem;
        padding: 1.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .jacket-card {
        border: 1px solid #dedede;
        border-radius: 4px;
        padding: 1rem;
        width: 200px;
        text-align: center;
      }
      .demo-error {
        padding: 1rem;
        color: #c62828;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="brand">Coats N Stuff</span>
      <span>Call us: <span class="phone-number">Loading&hellip;</span></span>
    </nav>
    <div class="jumbotron">
      <h1>A fine selection of jackets</h1>
      <p>This page simulates a real customer website with the Hopups widget embedded.</p>
    </div>
    <div class="jackets">
      <div class="jacket-card"><h3>Long</h3><p>A long jacket for long days.</p></div>
      <div class="jacket-card"><h3>Medium</h3><p>Right in the middle.</p></div>
      <div class="jacket-card"><h3>Short</h3><p>Short and sharp.</p></div>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var siteId = params.get("siteId");
        var apiBase = params.get("apiBase");

        if (!siteId || !apiBase) {
          var message = document.createElement("p");
          message.className = "demo-error";
          message.textContent = "Missing siteId/apiBase query params.";
          document.body.appendChild(message);
          return;
        }

        var script = document.createElement("script");
        script.src = apiBase + "/widget/loader.js";
        script.setAttribute("data-site-id", siteId);
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
